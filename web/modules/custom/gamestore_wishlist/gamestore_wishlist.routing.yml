gamestore_wishlist.toggle:
  path: '/wishlist/toggle/{product_id}'
  defaults:
    _controller: '\Drupal\gamestore_wishlist\Controller\WishlistController::toggle'
    _title: 'Toggle wishlist item'
  requirements:
    _permission: 'use gamestore wishlist'
    product_id: '\d+'

gamestore_wishlist.list:
  path: '/wishlist'
  defaults:
    _controller: '\Drupal\gamestore_wishlist\Controller\WishlistController::list'
    _title: 'Mijn wishlist'
  requirements:
    _permission: 'use gamestore wishlist'

gamestore_wishlist.admin:
  path: '/admin/commerce/wishlist'
  defaults:
    _controller: '\Drupal\gamestore_wishlist\Controller\WishlistAdminController::overview'
    _title: 'Wishlist overzicht'
  requirements:
    _permission: 'administer gamestore wishlist'
